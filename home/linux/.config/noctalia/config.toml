[bar.default]
margin_edge = 0
margin_ends = 4
radius = 12
thickness = 32

    [bar.default.dead_zone.actions]
    scroll_down = "volume-down"
    scroll_up = "volume-up"

[dock]
auto_hide = false
enabled = false
smart_auto_hide = true

[lockscreen]
tint_intensity = 0.24999999441206455

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 96.0
    box_width = 400.0
    cx = 1152.0
    cy = 648.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true
        show_session_buttons = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 201.0
    box_width = 720.0
    cx = 287.0
    cy = 528.0
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true
        show_session_buttons = true

[plugins]
enabled = []

[shell]
font_family = "Iosevka Aile"
time_format = "{:%-l:%M %p}"

    [shell.animation]
    speed = 4.0

[theme]
community_palette = "Rosey AMOLED"
custom_palette = "mfd-amber"
pure_black_dark = false

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]

[wallpaper]
enabled = false
fill_color = "#000000"
fill_mode = "center"

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
unit = "imperial"
