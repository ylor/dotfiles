<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Ioskeley ships as dual-width (spacing=90). Pickers that filter on spacing=100 hide it. -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Ioskeley Mono</string>
    </test>
    <edit name="spacing" mode="assign">
      <const>mono</const>
    </edit>
  </match>
</fontconfig>
