[settings]
env_file = ".env"
minimum_release_age = "0s"

[settings.ruby]

[settings.self_update]
auto = true
check_duration = "1h"

[settings.tool_update]
global_auto = true
check_duration = "1h"

[settings.upgrade]
auto_prune = true

[tools]
claude = "latest"
cloudflared = "latest"
codex = "latest"
delta = "latest"
node = "latest"
opencode = "latest"
pi = "latest"
uv = "latest"
