# Pin glassy alpha so flea draws Phosphor amber as-is instead of lifting it toward white.
[flea]
background-alpha = 0.80

# A brighter phosphor flare instead of red for "look at me".
[bar]
active = "#ffb15e"

[notifications]
countdown = "#ff8d09"

[menu]
selected-background = "#6c3801"
selected-background-alpha = 0.2
selected-text = "#ffb15e"

[lock]
text = "#ffb15e"
