# AmberConsole neon plasma: one emitter, five drive levels, three surfaces.
# Source: DutchDiederik/AmberConsole e616e1c (identical to main on 2026-11-08),
# src/tokens/colors.css. Every value below is one of the neon tokens; see DESIGN.md.
#
#   screen #100600   screen-raised #1b0c02   screen-well #060200   on-fill #1e0c00
#   emit-100 #ffa86d   emit-90 #ff6b08   emit-70 #dd5800   emit-50 #ab4500   emit-30 #5b2500
mode = "dark"

# ink-bright: hot highlight, focus, the operator's cursor.
accent = "#ffa86d"
# Inverse video: fill on on-fill (base/reset.css ::selection).
selection = "#ff6b08"
selection_background = "#ff6b08"
selection_foreground = "#1e0c00"
# ink-faint: comments, autosuggestions, placeholders, inactive text. Never body text.
muted = "#ab4500"

background = "#100600"
dark_background = "#060200"
darker_background = "#060200"
lighter_background = "#1b0c02"

# ink / ink-dim / ink-bright.
foreground = "#ff6b08"
dark_foreground = "#dd5800"
light_foreground = "#ffa86d"
bright_foreground = "#ffa86d"

# stroke-bright on the focused window, stroke-dim on the rest (panel / panel--dim).
hyprland_active_border = "#ffa86d"
hyprland_inactive_border = "#ab4500"

# ANSI by drive level, never by hue. Severity climbs the ramp: info and success
# sit at ink-dim, warnings and keywords at ink, errors at ink-bright. Each bright
# slot is one stop above its normal slot; red is already at the top.
# emit-30 never appears here: it is decorative and fails every text gate.
green = "#dd5800"
cyan = "#dd5800"
blue = "#dd5800"
brown = "#dd5800"
yellow = "#ff6b08"
magenta = "#ff6b08"
orange = "#ffa86d"
red = "#ffa86d"

bright_green = "#ff6b08"
bright_cyan = "#ff6b08"
bright_blue = "#ff6b08"
bright_yellow = "#ffa86d"
bright_magenta = "#ffa86d"
bright_red = "#ffa86d"
