general {
    before_sleep_cmd = omarchy system lock
    # The bar clock's minute timer pauses during suspend, so it shows the old
    # time for up to a minute after resume. Refresh it right away on wake.
    # hyprsunset has the same lag picking its profile, so restart it too. Wait for
    # the old one to exit first, or the new one finds the CTM manager taken and quits.
    after_sleep_cmd = omarchy-shell -q omarchy.clock refresh; omarchy system wake; pkill -x hyprsunset; pidwait -x hyprsunset; omarchy-restart-hyprsunset
}

listener {
    timeout = 3600
    # Honor Omarchy's Stay Awake toggle as well as hypridle's default inhibitors.
    on-timeout = test -e "$HOME/.local/state/omarchy/indicators/stay-awake" || systemctl suspend
}
