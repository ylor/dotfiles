<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Checking for JetBrains first is the only way to spot a bare "monospace"
       request: 50-omarchy.conf runs before this file and swaps it for JetBrains.
       Testing "monospace" alone is not enough, because fontconfig adds it to any
       family it knows is monospace, so every named mono font would become Berkeley.
       "JetBrains Mono" is listed too because apps like Strata hardcode it as the
       Omarchy mono font instead of asking for "monospace". -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <test name="family" qual="first"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Berkeley Mono Variable</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>JetBrains Mono</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Berkeley Mono Variable</string>
    </edit>
  </match>
</fontconfig>
